# Include this server/location fragment only in the med.roche.ru vhost.
# Existing dashboard routes remain outside this site-owned patch.
location = /dashboard/medroche { return 308 /dashboard/medroche/; }
location ^~ /dashboard/medroche/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
location ^~ /_next-medroche/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
